<text x="335" y="558" font-size="44" fill="#ffffff">$0.8B</text>
<text x="605" y="290" font-size="56" fill="#ffffff">$3.79B</text>
<text x="335" y="710" font-size="34" fill="#7ee8fa">2013</text>
<text x="605" y="710" font-size="34" fill="#ff9a9e">2026</text>
