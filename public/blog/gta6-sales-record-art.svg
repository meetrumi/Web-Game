<g fill="#12062b">
<rect x="0" y="640" width="1600" height="260"/>
<rect x="60" y="520" width="90" height="130"/><rect x="160" y="470" width="70" height="180"/><rect x="240" y="545" width="110" height="105"/>
<rect x="1360" y="500" width="80" height="150"/><rect x="1450" y="440" width="70" height="210"/><rect x="1530" y="530" width="70" height="120"/>
</g>
