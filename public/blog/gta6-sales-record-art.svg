<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Neon bar chart comparing GTA V and GTA 6 day-one revenue">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0b3d"/><stop offset=".55" stop-color="#5b1a7a"/><stop offset="1" stop-color="#ff6a6a"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe259"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient>
<linearGradient id="barA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ee8fa"/><stop offset="1" stop-color="#3a7bd5"/></linearGradient>
<linearGradient id="barB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a9e"/><stop offset="1" stop-color="#ff2e8a"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1180" cy="560" r="230" fill="url(#sun)" opacity=".9"/>
