<path d="M880 650 C 870 560, 860 500, 900 430"/><path d="M900 430 c -60 -10 -110 10 -140 40 M900 430 c -30 -40 -80 -55 -130 -45 M900 430 c 20 -50 70 -70 120 -60 M900 430 c 60 -5 100 25 120 60 M900 430 c 10 -60 0 -100 -20 -130"/>
<path d="M1030 650 C 1025 590, 1020 540, 1045 490"/><path d="M1045 490 c -45 -8 -80 8 -100 30 M1045 490 c -20 -30 -60 -40 -95 -32 M1045 490 c 15 -38 52 -52 90 -45 M1045 490 c 45 -3 75 18 90 45"/>
