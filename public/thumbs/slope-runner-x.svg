<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Slope Runner X">
  <defs>
    <linearGradient id="g" gradientTransform="rotate(50 .5 .5)">
      <stop offset="0%" stop-color="#1d3df5"/>
      <stop offset="100%" stop-color="#7f3df5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="320" cy="150" r="330" fill="url(#glow)"/>
  <text x="50%" y="46%" text-anchor="middle" dominant-baseline="middle"
    font-family="ui-sans-serif, system-ui, sans-serif" font-size="180"
    font-weight="800" fill="#ffffff" fill-opacity=".95">SR</text>
  <text x="50%" y="72%" text-anchor="middle"
    font-family="ui-sans-serif, system-ui, sans-serif" font-size="45"
    font-weight="600" letter-spacing="1.5" fill="#ffffff" fill-opacity=".8">UNBLOCKED</text>
</svg>
